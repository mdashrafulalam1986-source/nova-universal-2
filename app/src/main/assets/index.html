<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nova Universal Remote</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121418;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* No-Scroll Layout */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
        }
        .header {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #8E8E93;
            margin-bottom: 10px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }
        .btn {
            background: #2C2C2E;
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
            background: #3A3A3C;
        }
        .btn-power {
            background: #FF453A;
            color: #FFF;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(255, 69, 58, 0.4);
        }
        .btn-power:active {
            background: #D73A31;
        }
        .d-pad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }
        .d-pad {
            width: 200px;
            height: 200px;
            background: #1C1C1E;
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 4px 15px rgba(0,0,0,0.4);
        }
        .d-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: #8E8E93;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .d-btn:active { color: #FFFFFF; }
        .d-up { top: 15px; left: 50%; transform: translateX(-50%); }
        .d-down { bottom: 15px; left: 50%; transform: translateX(-50%); }
        .d-left { left: 15px; top: 50%; transform: translateY(-50%); }
        .d-right { right: 15px; top: 50%; transform: translateY(-50%); }
        .d-ok {
            width: 70px;
            height: 70px;
            background: #2C2C2E;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFFFFF;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }
        .pillar {
            background: #1C1C1E;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            height: 140px;
        }
        .pillar .btn-pill {
            width: 100%;
            height: 45px;
            background: transparent;
            box-shadow: none;
            font-size: 18px;
        }
        .pillar-label {
            font-size: 12px;
            color: #8E8E93;
            font-weight: 600;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 10px;
        }
        .btn-nav {
            width: 55px;
            height: 45px;
            border-radius: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">NOVA UNIVERSAL</div>

    <!-- Power & Mute Bar -->
    <div class="top-bar">
        <button class="btn btn-power" onclick="onPowerButtonClick()">PWR</button>
        <button class="btn btn-nav" onclick="onCommand('MUTE')">MUTE</button>
    </div>

    <!-- Directional Navigation Pad -->
    <div class="d-pad-container">
        <div class="d-pad">
            <button class="d-btn d-up" onclick="onCommand('UP')">▲</button>
            <button class="d-btn d-down" onclick="onCommand('DOWN')">▼</button>
            <button class="d-btn d-left" onclick="onCommand('LEFT')">◄</button>
            <button class="d-btn d-right" onclick="onCommand('RIGHT')">►</button>
            <button class="d-btn d-ok" onclick="onCommand('OK')">OK</button>
        </div>
    </div>

    <!-- Volume & Channel Control Pillars -->
    <div class="control-grid">
        <div class="pillar">
            <button class="btn btn-pill" onclick="onCommand('VOL_UP')">+</button>
            <span class="pillar-label">VOL</span>
            <button class="btn btn-pill" onclick="onCommand('VOL_DOWN')">-</button>
        </div>
        <div class="pillar">
            <button class="btn btn-pill" onclick="onCommand('CH_UP')">▲</button>
            <span class="pillar-label">CH</span>
            <button class="btn btn-pill" onclick="onCommand('CH_DOWN')">▼</button>
        </div>
    </div>

    <!-- Extra Navigation -->
    <div class="nav-bar">
        <button class="btn btn-nav" onclick="onCommand('BACK')">BACK</button>
        <button class="btn btn-nav" onclick="onCommand('HOME')">HOME</button>
        <button class="btn btn-nav" onclick="onCommand('MENU')">MENU</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
